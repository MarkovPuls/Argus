[pytest]
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_cli=true
log_level=INFO


addopts =
    tests/ui
    -rsxX
    -l
    -x
    --alluredir=reports/allure-results
    --clean-alluredir

markers =
    api: API tests
    ui: UI tests

python_classes = Test*
python_functions = test_*
python_files = test_*.py
